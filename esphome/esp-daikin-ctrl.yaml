esphome:
  name: esp-daikin-ctrl
  friendly_name: "ESP32 WiFi Daikin Controller"
  name_add_mac_suffix: True

  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
  variant: ESP32C3

# Enable logging
logger:
  level: VERY_VERBOSE
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 2500000

#Enable Home Assistant API
api:

ota:
  platform: esphome

wifi:
  ap:
  # ssid: !secret wifi_ssid
  # password: !secret wifi_password
  # fast_connect: true

captive_portal: 

external_components:
  - source: components

status_led:
    pin: GPIO4

climate:
  - platform: daikin_ducted
    id: daikin0
    name: "Ducted AC"

    # Thermistor diagnostics (6 internal temperature sensors)
    # These sensors provide detailed heat pump circuit diagnostics for monitoring efficiency and health
    # Monitor Th1-Th2 delta for system performance: larger delta = better efficiency
    # In heating mode: Th1 (indoor evaporator) should be warmer than Th5 (outdoor condenser)
    # In cooling mode: Th1 should be cooler than outdoor ambient temperature
    #
    # WARNING: If Th5 suddenly jumps to extreme values (>95°C), this indicates potential compressor/system issues
    thermistor_th1:
      name: "Liquid Line Temperature (Th1)"
      unit_of_measurement: "°C"
      icon: "mdi:thermometer"
      id: "th1_sensor"
      # Liquid refrigerant entering the indoor/outdoor heat exchanger
      # Normal range: 5-50°C depending on mode and season
    thermistor_th2:
      name: "Gas Line Temperature (Th2)"
      unit_of_measurement: "°C"
      icon: "mdi:thermometer"
      id: "th2_sensor"
      # Vapor/gas refrigerant exiting the heat exchanger and returning to compressor
      # Normal range: 5-45°C (cooling), heating mode varies widely
    thermistor_th3:
      name: "Compressor Suction Temperature (Th3)"
      unit_of_measurement: "°C"
      icon: "mdi:thermometer"
      id: "th3_sensor"
      # Low-pressure vapor entering compressor inlet
      # Normal range: -5 to 25°C (should not be near freezing in cooling)
    thermistor_th4:
      name: "Compressor Discharge Temperature (Th4)"
      unit_of_measurement: "°C"
      icon: "mdi:thermometer"
      id: "th4_sensor"
      # High-pressure hot vapor leaving compressor
      # Normal range: 40-90°C (cooling), 70-100°C (heating)
      # Excessive values (>100°C) = overheating, efficiency issue
    thermistor_th5:
      name: "Outdoor Heat Exchanger (Th5)"
      unit_of_measurement: "°C"
      icon: "mdi:thermometer"
      id: "th5_sensor"
      # Condenser (cooling mode) or evaporator (heating mode) temperature
      # Normal range: -10 to 60°C depending on mode
    thermistor_th6:
      name: "Outdoor Ambient Temperature (Th6)"
      unit_of_measurement: "°C"
      icon: "mdi:thermometer"
      id: "th6_sensor"
      # Outdoor air temperature sensor
      # Normal range: -15 to 50°C (operational limits)

    # Room temperature sensors (from packet 0x11)
    room_temperature:
      name: "Room Temperature"
      unit_of_measurement: "°C"
      icon: "mdi:home-thermometer"
      id: "room_temp_sensor"
      # Actual room temperature sensed by the main controller thermostat
      # This is what the system uses for temperature feedback/control
    intake_temperature:
      name: "Outdoor Intake Temperature"
      unit_of_measurement: "°C"
      icon: "mdi:thermometer"
      id: "intake_temp_sensor"
      # Outdoor unit intake/ambient temperature measurement
      # Used for system performance monitoring and diagnostics

    # Filter maintenance sensors (from packet 0x39/0x3C)
    filter_hours:
      name: "Filter Usage Hours"
      unit_of_measurement: "h"
      icon: "mdi:air-filter"
      id: "filter_hours_sensor"
      # Filter counter - tracks hours of operation before cleaning needed
      # Check filter when alarm is active
    filter_alarm:
      name: "Filter Needs Cleaning"
      icon: "mdi:alert-circle"
      id: "filter_alarm_binary"
      # When TRUE: filter needs cleaning/replacement
      # When FALSE: filter is clean and operational
      # Optional: Create automation to send notifications when filter alarm activates

    # Error code sensors (from packet 0x38)
    error_code:
      name: "System Error Code"
      icon: "mdi:alert-circle-outline"
      id: "error_code_text"
      # Shows error code in format "EXX-YY" or "OK" if no error
      # Example: E04-02 = communication error, U4-01 = temperature sensor error
    has_error:
      name: "System Error Active"
      icon: "mdi:alert"
      id: "has_error_binary"
      # When TRUE: System has an error code
      # When FALSE: System is operating normally
      # Optional: Create automation to alert user when error becomes active

    # Energy counters and statistics
    energy_produced:
      name: "Heat Pump Energy Produced"
      id: "energy_produced_sensor"
      unit_of_measurement: "kWh"
    electricity_consumed:
      name: "Heat Pump Electricity Consumed"
      id: "electricity_consumed_sensor"
      unit_of_measurement: "kWh"
    runtime_hours:
      name: "System Runtime Hours"
      id: "runtime_hours_sensor"
      unit_of_measurement: "h"
    compressor_runtime_hours:
      name: "Compressor Runtime Hours"
      id: "compressor_runtime_sensor"
      unit_of_measurement: "h"

    # COP (Coefficient of Performance) metrics
    cop_lifetime:
      name: "COP Lifetime"
      id: "cop_lifetime_sensor"
    cop_period:
      name: "COP Since Baseline"
      id: "cop_period_sensor"
    cop_realtime:
      name: "COP Real-time"
      id: "cop_realtime_sensor"

    # Product identification
    product_name:
      name: "Product Model"
      id: "product_name_text"
    f_series_variant:
      name: "F-Series Variant"
      id: "f_series_variant_text"

    # Operational state
    compressor_active:
      name: "Compressor Active"
      id: "compressor_active_binary"

    # Optional: Real-time COP with external power meter
    # Uncomment and configure if you have an external energy meter (e.g., ATM90E32)
    # This calculates instantaneous COP using the Daikin's lifetime efficiency
    # correlated with your external power meter readings.
    #
    # IMPORTANT: Pass POWER in WATTS, not amps or voltage!
    # Your energy meter should provide direct power measurement (watts), which
    # already accounts for voltage, current, and power factor.
    #
    # Example with per-phase monitoring (recommended for multi-unit setup):
    # - For Red Phase Daikin unit, use: external_power_sensor_id: sensor.enermon_ac_red_watts
    # - For Yellow Phase unit, use: external_power_sensor_id: sensor.enermon_ac_yellow_watts
    # - For Blue Phase unit, use: external_power_sensor_id: sensor.enermon_ac_blue_watts
    #
    # external_power_sensor_id: sensor.enermon_ac_red_watts  # Reference to your power meter entity (watts)

    on_state:
      then:
        lambda: |-
          auto call = id(templatefan0).make_call();

          if(x.mode != climate::CLIMATE_MODE_FAN_ONLY)
            return;

          if(x.fan_mode == climate::CLIMATE_FAN_LOW)
            call.set_speed(1);
          else if(x.fan_mode == climate::CLIMATE_FAN_MEDIUM)
            call.set_speed(2);
          else if(x.fan_mode == climate::CLIMATE_FAN_HIGH)
            call.set_speed(3);

          if(  id(templatefan0).speed != call.get_speed())
            call.perform();

fan:
  - platform: template
    name: "Ducted Fan"
    id: templatefan0
    speed_count: 3
    on_state:
      then:
        lambda: |-
          auto call = id(daikin0).make_call();
          call.set_mode(x->state ? "FAN_ONLY" : "OFF");

          if(id(daikin0).mode != call.get_mode())
            call.perform();
    on_speed_set:
      then:
        lambda: |-
          auto call = id(daikin0).make_call();
          switch(x) {
            case 1: call.set_fan_mode("LOW"); break;
            case 2: call.set_fan_mode("MEDIUM"); break;
            case 3: call.set_fan_mode("HIGH"); break;
            default: break;
          }

          if(id(daikin0).fan_mode != call.get_fan_mode())
            call.perform();